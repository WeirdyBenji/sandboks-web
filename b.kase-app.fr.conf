server {
    listen 80;
    listen [::]:80;
    server_name b.kase-app.fr;

    return 301 https://b.kase-app.fr$request_uri;
}

server {
    listen 3000;
    server_name weirdy weirdybenji.fr www.weirdybenji.fr b.kase-app.fr;

    root /var/www/weirdybenji.fr;
    index index.html;

    client_max_body_size 10g;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    real_ip_recursive on;
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    satisfy any;
    allow 86.250.153.4;
    deny all;
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd-weirdybenji;


    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location /uploads/ {
        alias /var/www/weirdybenji.fr/uploads/;
        autoindex on;
    }

    location /upload {
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3001;
    }

    location = /tree {
        return 302 /tree/;
    }

    location /tree/ {
        try_files $uri $uri/ /tree/index.html;
    }

    location = /bgstats {
        return 302 /bgstats/;
    }

    location /bgstats/ {
        proxy_pass http://127.0.0.1:3003;
    }

    location = /filmage {
        return 302 /filmage/;
    }

    location /filmage/ {
        proxy_pass http://127.0.0.1:3004;
    }

    location = /micro {
        return 302 /micro/;
    }

    location /micro/ {
        proxy_pass http://127.0.0.1:3005;
    }

    location = /prio {
        return 302 /prio/;
    }

    location /prio/ {
        proxy_pass http://127.0.0.1:3006;
    }


    location = /game-notifier {
        return 302 /game-notifier/;
    }

    location /game-notifier/ {
        proxy_pass http://127.0.0.1:3008/;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:3008;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:3008;
    }

    location = /history {
        proxy_pass http://127.0.0.1:3008;
    }

    location /history/ {
        proxy_pass http://127.0.0.1:3008;
    }

    location = /logout {
        proxy_pass http://127.0.0.1:3008;
    }

    location = /favicon.svg {
        proxy_pass http://127.0.0.1:3008;
    }

    location = /sandboks {
        return 302 /sandboks/;
    }

    location /sandboks/ {
        client_max_body_size 10g;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3007/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
