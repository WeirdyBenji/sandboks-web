<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
<title>Shorucoto</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.container {
    min-height: 100vh;
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    place-content: center; /* centrage vertical + horizontal */
}

a {
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-decoration: none;
    font-size: 1.4rem;
    font-weight: 600;
    color: white;
    border-radius: 16px;
    transition: transform 0.15s ease;
}

a:active {
    transform: scale(0.97);
}

/* Couleurs */
.tree   { background: #22c55e; }
.board { background: #3b82f6; }
.movie { background: #f97316; }
.matrix{ background: #a855f7; }
.micro { background: #14b8a6; }
.sandboks { background: #eab308; }

/* Desktop */
@media (min-width: 768px) {
    .container {
        grid-template-columns: repeat(2, 1fr);
        max-width: 900px;
        margin: auto;
    }

    a {
        height: 160px;
        font-size: 1.6rem;
    }
}
</style>
</head>

<body>
<div class="container">
    <a class="tree" href="/tree/">🌳 Tree</a>
    <a class="board" href="/bgstats/">🎲 BG Stats</a>
    <a class="movie" href="/filmage/">🎬 Filmage</a>
    <a class="matrix" href="/prio/">📊 Matrice de priorisation</a>
    <a class="micro" href="/micro/">🔬 Micro</a>
    <a class="sandboks" href="/sandboks/">🧰 Sandboks</a>
</div>
</body>
</html>
