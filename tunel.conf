upstream app_server_b {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name b.kase-app.fr;

    client_max_body_size 10g;

    ssl_certificate /etc/letsencrypt/live/kase-app.fr-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kase-app.fr-0002/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        client_max_body_size 10g;
        proxy_request_buffering off;

        proxy_pass http://app_server_b;
        proxy_redirect off;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
